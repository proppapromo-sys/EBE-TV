services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: streaming
      POSTGRES_USER: streaming
      POSTGRES_PASSWORD: streaming
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U streaming"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports: ["6379:6379"]

  backend:
    build: { context: ./backend, dockerfile: ../infra/Dockerfile.backend }
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_demo &&
             gunicorn config.wsgi:application -b 0.0.0.0:8000 --workers 3"
    environment:
      DATABASE_URL: postgres://streaming:streaming@db:5432/streaming
      REDIS_URL: redis://redis:6379/0
      DJANGO_SECRET_KEY: dev-compose-secret
      DEBUG: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    env_file: [./backend/.env]
    ports: ["8000:8000"]
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }

  web:
    build: { context: ./web, dockerfile: ../infra/Dockerfile.web }
    environment:
      NEXT_PUBLIC_API_BASE: http://localhost:8000/api
    ports: ["3000:3000"]
    depends_on: [backend]

volumes:
  pgdata:
